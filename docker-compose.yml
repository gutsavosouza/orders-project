services:
  order-db:
    image: postgres:17
    container_name: orders-database
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack:
    image: localstack/localstack:2026.08
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs, sns
      AWS_DEFAULT_REGION: sa-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "./scripts/ready.d:/etc/localstack/init/ready.d"
      # - "/var/run/docker.sock:/var/run/docker.sock"

  adminer:
    image: adminer
    ports:
      - "7777:8080"
    depends_on:
      - order-db
      
volumes:
  pgdata: